<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
  <nav class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
    <div class="flex gap-4 align-middle">
      <img
        routerLink="/"
        src="https://media.giphy.com/media/3HbtyiV6otnLf4WHSN/giphy.gif"
        alt="Logo"
        class="max-h-12"/>
      <div class="flex flex-col">
        <h1 class="text-2xl font-bold">DuckStore</h1>
        <p class="text-sm">by Keveen Menezes</p>
      </div>
    </div>
    <div class="flex gap-3 my-2 uppercase text-xl">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}">
        Home
      </a>
      <a
        routerLink="/shop"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact:true}">
        Shop
      </a>
      <a
        routerLink="/test-error"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact:true}">
        Errors
      </a>
    </div>
    <div class="flex gap-3 align-middle">
      <a
        matBadge="5"
        matBadgeSize="large"
        class="custom-badge mt-2 mr-2"
        href="#">
        <mat-icon>shopping_cart</mat-icon>
      </a>
      <button mat-stroked-button>Login</button>
      <button mat-stroked-button>Register</button>
    </div>
  </nav>
</header>

@if (busyService.loading ){
  <mat-progress-bar
    mode="indeterminate"
    color="primary"
    class="fixed top-20 left-0 w-full z-50">
  </mat-progress-bar>
}
