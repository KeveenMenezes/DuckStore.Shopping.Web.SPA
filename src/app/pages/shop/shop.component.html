<div class="flex flex-col gap-3">
  <div class="flex justify-between gap-3">
    <mat-paginator
      class="bg-transparent"
      (page)="handlePageEvent($event)"
      [length]="productsPagination?.count"
      [pageSize]="shopParams.pageSize"
      [showFirstLastButtons]="true"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="shopParams.pageNumber - 1"
      aria-label="Select page">
    </mat-paginator>
    <form
      #searchForm="ngForm"
      (ngSubmit)="onSearchChange()"
      class="relative flex items-center w-full max-w-md mx-4">
      <input
        type="search"
        class="block w-full p-2 text-sm text-gray-300 border border-gray-300 rounded-lg"
        placeholder="Search"
        name="search"
        [(ngModel)]="shopParams.search"/>
      <button
        mat-icon-button
        type="submit"
        class="absolute inset-y-0 right-7 flex items-center pl-2"
        aria-label="Buscar">
        <mat-icon>search</mat-icon>
      </button>
    </form>
    <div class="flex justify-between items-center gap-3">
        <button mat-stroked-button (click)="openFiltersDialog()">
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>
        <button mat-stroked-button [matMenuTriggerFor]="sortMenu">
          <mat-icon>swap_vert</mat-icon>
          Sort
        </button>
      </div>
    </div>
</div>
<div class="grid grid-cols-5 gap-4">
  @for(product of productsPagination?.items; track product.id) {
    <app-product-item [product]="product"></app-product-item>
  }
</div>

<mat-menu #sortMenu="matMenu">
  <mat-selection-list [multiple]="false" (selectionChange)="onShortChange($event)">
    @for(sort of sortOptions; track $index){
      <mat-list-option
        [value]="sort.value"
        [selected]="shopParams.sort === sort.value">
        {{sort.name}}
      </mat-list-option> }
  </mat-selection-list>
</mat-menu>
